version: "2"

run:
  timeout: 20m
  modules-download-mode: readonly
  relative-path-mode: gomod

linters:
  default: standard
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - gocheckcompilerdirectives
    - cyclop
    - funlen
    - gocritic
    - gosec
    - nilerr
    - nilnesserr
    - nolintlint
    - rowserrcheck
    - sqlclosecheck
  settings:
    funlen:
      lines: 150
      statements: 80
    cyclop:
      max-complexity: 40
    gocritic:
      enable-all: true
      settings:
        hugeParam:
          sizeThreshold: 256
        rangeValCopy:
          sizeThreshold: 512
        unnamedResult:
          checkExported: true
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
    rules:
      - path: _test\.go
        linters:
          - bodyclose
          - errcheck
          - gosec
          - dupl
          - funlen
          - cyclop
      # Known debt: each function below is over the funlen/cyclop limits and is
      # waiting to be split. Remove its line when it is; never add one.
      - linters: [funlen, cyclop]
        text: "(runBatchDownload|downloadAndPlayEpisode|'main'|'DownloadWithProgress'|playVideo|'update'|ShowBeautifulHelp|'FlagParser'|handleDownloadModeWithSmart)"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
